# Warsaw Transport Map Application Configuration

# API Configuration
api.warsaw.base.url=https://api.um.warszawa.pl/api/action
api.warsaw.timeout.seconds=30
api.warsaw.retry.attempts=3

# Update Intervals (in seconds)
update.interval.vehicles=30
update.interval.stops=3600

# Map Configuration
map.default.latitude=52.2297
map.default.longitude=21.0122
map.default.zoom=11
map.max.zoom=18
map.min.zoom=8

# UI Configuration
ui.window.width=1200
ui.window.height=800
ui.window.min.width=800
ui.window.min.height=600

# Data Configuration
data.cache.vehicle.max.age.minutes=5
data.cache.stops.max.age.hours=24
data.max.vehicles.display=2000

# Logging Configuration
logging.level.root=INFO
logging.level.com.warsaw.transport=DEBUG
